plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
	}
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"taskmanager" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// 固定开发客户端账号名，使离线模式 OP 授权稳定（否则每次 runClient 随机 PlayerXXX）
	runConfigs {
		client {
			programArg "--username=Dev"
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

configurations {
	embed
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// 主动适配的可选依赖（编译期可用、运行期可选，不打包进最终 jar）
	// 注意：Loom 1.17 为 no-remap 模式，用标准 compileOnly；版本号用 Modrinth version id 避免 "+" 被当作动态版本。
	compileOnly "maven.modrinth:iris:oaD6KQls"          // Iris 1.11.2+26.2-fabric
	compileOnly "maven.modrinth:sodium:a9YZH3ip"        // Sodium mc26.2-0.9.2-alpha.4-fabric

	// 拼音搜索（BSD 许可，宽松，可闭源）；embed 配置用于解包进所有 jar（纯 Java 库，无需 remap）
	implementation "com.belerweb:pinyin4j:2.5.1"
	embed "com.belerweb:pinyin4j:2.5.1"

	// 磁盘 I/O 监控：JNA 调 Windows GetProcessIoCounters（LWJGL 传递依赖已提供运行时 JNA，编译期仅需签名）
	compileOnly "net.java.dev.jna:jna:5.17.0"
	compileOnly "net.java.dev.jna:jna-platform:5.17.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	// 处理三个 fabric.mod.json（无拆分版 + 服务端版 + 客户端版）的 version 占位符
	filesMatching("fabric*.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.compilerArgs += ['-Xlint:deprecation']
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// 解包 pinyin4j 到 jar（纯 Java 库，无需 remap；BSD 许可允许，排除清单避免冲突）
def pinyinTrees = {
	project.configurations.embed.collect { it.isDirectory() ? it : zipTree(it) }
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	// 无拆分版本（environment=*）：排除服务端/客户端专用的 fabric.mod.json
	exclude("fabric.server.mod.json")
	exclude("fabric.client.mod.json")
	from pinyinTrees() {
		exclude("META-INF/MANIFEST.MF")
	}
}

// 服务端专用 jar（environment=server，id=taskmanager）
tasks.register("serverJar", Jar) {
	archiveClassifier = "server"
	from sourceSets.main.output
	exclude("fabric.mod.json")
	exclude("fabric.client.mod.json")
	rename("fabric.server.mod.json", "fabric.mod.json")
	from pinyinTrees() {
		exclude("META-INF/MANIFEST.MF")
	}
}

// 客户端专用 jar（environment=client，id=taskmanager-client）
tasks.register("clientJar", Jar) {
	archiveClassifier = "client"
	from sourceSets.main.output
	from sourceSets.client.output
	exclude("fabric.mod.json")
	exclude("fabric.server.mod.json")
	rename("fabric.client.mod.json", "fabric.mod.json")
	from pinyinTrees() {
		exclude("META-INF/MANIFEST.MF")
	}
}

// 让 build 任务一并产出拆分版两个 jar
tasks.named("build") {
	dependsOn tasks.named("serverJar"), tasks.named("clientJar")
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
